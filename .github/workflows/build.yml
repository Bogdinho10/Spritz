name: Build Spritz

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Spritz-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build/Spritz_artefacts/Release/VST3
            build/Spritz_artefacts/Release/AU
            build/Spritz_artefacts/Release/Standalone
